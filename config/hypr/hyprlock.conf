# Lock screen: big weekday, 12h time, cava bars. Super+L.
# Background path is rewritten when the wallpaper changes.

background {
    monitor =
    path = /home/ping/.config/wallpapers/kita.png
    blur_passes = 1
    blur_size = 3
    noise = 0.0
    contrast = 0.95
    brightness = 0.82
    vibrancy = 0.16
    vibrancy_darkness = 0.0
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
    hide_cursor = false
}

# tuesday
label {
    monitor =
    text = cmd[update:60000] /home/ping/.config/hypr/scripts/lock-label.sh day
    color = rgba(245, 238, 228, 0.94)
    font_size = 108
    font_family = Comfortaa Light
    position = 0, 88
    halign = center
    valign = center
}

# - 08:59PM -
label {
    monitor =
    text = cmd[update:1000] /home/ping/.config/hypr/scripts/lock-label.sh time
    color = rgba(245, 238, 228, 0.72)
    font_size = 18
    font_family = Comfortaa Light
    position = 0, 12
    halign = center
    valign = center
}

# music visualizer (cava, started by lock.sh)
label {
    monitor =
    text = cmd[update:50] /home/ping/.config/hypr/scripts/lock-label.sh cava
    color = rgba(245, 238, 228, 0.82)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -36
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true

    outer_color = rgba(236, 228, 220, 0.28)
    inner_color = rgba(16, 10, 12, 0.42)
    font_color = rgba(245, 240, 236, 1.0)
    fade_on_empty = true

    check_color = rgba(170, 210, 170, 0.85)
    fail_color = rgba(210, 80, 90, 0.9)

    placeholder_text = <span foreground="##c9bbb4"><i>password</i></span>
    position = 0, -130
    halign = center
    valign = center
}

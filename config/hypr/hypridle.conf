# Idle: dim, lock, sleep.
# DPMS commands use the Lua dispatcher — this Hyprland build does not
# understand the classic `hyprctl dispatch dpms` form.

general {
    lock_cmd = pidof hyprlock || hyprlock -c /home/ping/.config/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'; /home/ping/.config/hypr/scripts/idle-undim.sh
    ignore_dbus_inhibit = false
}

listener {
    timeout = 60
    on-timeout = /home/ping/.config/hypr/scripts/idle-dim.sh
    on-resume = /home/ping/.config/hypr/scripts/idle-undim.sh
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

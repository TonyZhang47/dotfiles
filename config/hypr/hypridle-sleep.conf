# Lock and restore the screen around a real suspend.
# No idle timeouts: this is the config used while plugged in, so the
# screen does not dim or lock just because the machine is idle.
general {
    lock_cmd = pidof hyprlock || hyprlock -c /home/ping/.config/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'; /home/ping/.config/hypr/scripts/idle-undim.sh
    ignore_dbus_inhibit = false
}

listener {
    timeout = 86400
    on-timeout = true
}

[mgr]
cwd = { fg = "#ccc9ce" }
hovered = { fg = "#ccc9ce", bg = "#3e3f54" }
preview_hovered = { underline = true }
find_keyword = { fg = "#c3bec6", italic = true }
find_position = { fg = "#b3acb8", bg = "reset", italic = true }
marker_copied = { fg = "#80d3a7", bg = "#80d3a7" }
marker_cut = { fg = "#e2b2ac", bg = "#e2b2ac" }
marker_selected = { fg = "#c3bec6", bg = "#c3bec6" }
tab_active = { fg = "#2e2f3f", bg = "#ccc9ce" }
tab_inactive = { fg = "#ccc9ce", bg = "#3e3f54" }
border_symbol = " "
border_style = { fg = "#4d4f69" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#3e3f54", bg = "#3e3f54" }
mode_normal = { fg = "#2e2f3f", bg = "#ccc9ce", bold = true }
mode_select = { fg = "#2e2f3f", bg = "#c3bec6", bold = true }
mode_unset = { fg = "#2e2f3f", bg = "#b3acb8", bold = true }
progress_label = { bold = true }
progress_normal = { fg = "#c3bec6", bg = "#2e2f3f" }
progress_error = { fg = "#e2b2ac", bg = "#2e2f3f" }

[which]
mask = { bg = "#2e2f3f" }
cand = { fg = "#c3bec6" }
rest = { fg = "#bcb6bf" }
desc = { fg = "#ccc9ce" }
separator_style = { fg = "#4d4f69" }

[confirm]
border = { fg = "#c3bec6" }
title = { fg = "#c3bec6" }

[spot]
border = { fg = "#c3bec6" }
title = { fg = "#c3bec6" }

[notify]
title_info = { fg = "#c3bec6" }
title_warn = { fg = "#80d3a7" }
title_error = { fg = "#e2b2ac" }

[pick]
border = { fg = "#c3bec6" }
active = { fg = "#ccc9ce" }

[input]
border = { fg = "#c3bec6" }
selected = { reversed = true }

[completion]
border = { fg = "#c3bec6" }
active = { reversed = true }

[tasks]
border = { fg = "#c3bec6" }
hovered = { underline = true }

[help]
on = { fg = "#c3bec6" }
run = { fg = "#ccc9ce" }
hovered = { reversed = true, bold = true }
footer = { fg = "#2e2f3f", bg = "#ccc9ce" }

[filetype]
rules = [
  { mime = "image/*", fg = "#c3bec6" },
  { mime = "video/*", fg = "#80d3a7" },
  { mime = "audio/*", fg = "#f1d7e9" },
  { mime = "application/*zip", fg = "#e2b2ac" },
  { mime = "application/x-tar", fg = "#e2b2ac" },
  { mime = "application/x-bzip*", fg = "#e2b2ac" },
  { name = "*/", fg = "#ccc9ce" },
]

[mgr]
cwd = { fg = "#a1a9b8" }
hovered = { fg = "#a1a9b8", bg = "#212932" }
preview_hovered = { underline = true }
find_keyword = { fg = "#93a1b8", italic = true }
find_position = { fg = "#8493ae", bg = "reset", italic = true }
marker_copied = { fg = "#8fa8c8", bg = "#8fa8c8" }
marker_cut = { fg = "#85a0c3", bg = "#85a0c3" }
marker_selected = { fg = "#93a1b8", bg = "#93a1b8" }
tab_active = { fg = "#0e1115", bg = "#a1a9b8" }
tab_inactive = { fg = "#a1a9b8", bg = "#212932" }
border_symbol = " "
border_style = { fg = "#343f4d" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#212932", bg = "#212932" }
mode_normal = { fg = "#0e1115", bg = "#a1a9b8", bold = true }
mode_select = { fg = "#0e1115", bg = "#93a1b8", bold = true }
mode_unset = { fg = "#0e1115", bg = "#8493ae", bold = true }
progress_label = { bold = true }
progress_normal = { fg = "#93a1b8", bg = "#0e1115" }
progress_error = { fg = "#85a0c3", bg = "#0e1115" }

[which]
mask = { bg = "#0e1115" }
cand = { fg = "#93a1b8" }
rest = { fg = "#8b9ab3" }
desc = { fg = "#a1a9b8" }
separator_style = { fg = "#343f4d" }

[confirm]
border = { fg = "#93a1b8" }
title = { fg = "#93a1b8" }

[spot]
border = { fg = "#93a1b8" }
title = { fg = "#93a1b8" }

[notify]
title_info = { fg = "#93a1b8" }
title_warn = { fg = "#8fa8c8" }
title_error = { fg = "#85a0c3" }

[pick]
border = { fg = "#93a1b8" }
active = { fg = "#a1a9b8" }

[input]
border = { fg = "#93a1b8" }
selected = { reversed = true }

[completion]
border = { fg = "#93a1b8" }
active = { reversed = true }

[tasks]
border = { fg = "#93a1b8" }
hovered = { underline = true }

[help]
on = { fg = "#93a1b8" }
run = { fg = "#a1a9b8" }
hovered = { reversed = true, bold = true }
footer = { fg = "#0e1115", bg = "#a1a9b8" }

[filetype]
rules = [
  { mime = "image/*", fg = "#93a1b8" },
  { mime = "video/*", fg = "#8fa8c8" },
  { mime = "audio/*", fg = "#abbdd5" },
  { mime = "application/*zip", fg = "#85a0c3" },
  { mime = "application/x-tar", fg = "#85a0c3" },
  { mime = "application/x-bzip*", fg = "#85a0c3" },
  { name = "*/", fg = "#a1a9b8" },
]

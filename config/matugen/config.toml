[config]

[templates.ags]
input_path = '~/.config/matugen/templates/ags-colors.scss'
# Rewriting this file is enough: AGS watches colors.scss and reapplies CSS
# without rebuilding the windows, so the wallpaper list keeps its scroll.
output_path = '~/.config/ags/colors.scss'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/kitty-colors.conf'

[templates.lush]
input_path = '~/.config/matugen/templates/lush-colors.json'
output_path = '~/.config/nvim/colors/lush-colors.json'

[templates.vim]
input_path = '~/.config/matugen/templates/vim-colors.vim'
output_path = '~/.config/nvim/colors/vim-colors.vim'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-dark-colors.rasi'
output_path = '~/.config/rofi/rofi-dark-colors.rasi'

[templates.mako]
input_path = '~/.config/matugen/templates/mako-config'
output_path = '~/.config/mako/config'

[templates.ghostty]
input_path = '~/.config/matugen/templates/ghostty-colors'
output_path = '~/.config/ghostty/ghostty-colors'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-config'
output_path = '~/.config/cava/config'

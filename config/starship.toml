"$schema" = 'https://starship.rs/config-schema.json'

# --- Prompt Formatting & Layout ---
add_newline = true

# Defines module order on the prompt
format = """
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$python\
$nodejs\
$java\
$cmd_duration\
$line_break\
$character"""

# --- Character / Prompt Symbol ---
[character]
success_symbol = "[❯](bold #e3a054)"
error_symbol = "[❯](bold #e98276)"

# --- Directory Module ---
[directory]
style = "bold #ca9460"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bold #e98276"

# --- Git Modules ---
[git_branch]
symbol = " "
style = "bold #b3c68b"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #e98276"
format = "[$all_status$ahead_behind]($style) "

# --- Programming Runtimes / Tools (Tokyo Night Colors) ---
[c]
symbol = " "
style = "bold #e3a054"
format = "[$symbol($version )]($style)"

[cpp]
symbol = " "
style = "bold #e3a054"
format = "[$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "bold #df913a"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #ca9460"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold #e09541"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "bold #a1b86f"
format = "[$symbol($version )]($style)"

[java]
symbol = " "
style = "bold #e98276"
format = "[$symbol($version )]($style)"

# --- Command Execution Time ---
[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "bold #e09541"


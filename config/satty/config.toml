[general]
copy-command = "wl-copy"
early-exit = ["copy", "save"]
corner-roundness = 12
annotation-size-factor = 1
disable-notifications = false

[font]
family = "Iosevka Nerd Font"
style = "Regular"

[color-palette]
palette = [
  "#a1a9b8",
  "#93a1b8",
  "#8b9ab3",
  "#8fa8c8",
  "#abbdd5",
  "#85a0c3",
]
